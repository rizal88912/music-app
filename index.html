<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 🔥 UBAH LOGO TAB BROWSER & ICON HP DI SINI 🔥 -->
    <!-- (Pastiin file rnctech.jpg udah lu copy ke dalam folder "public") -->
    <link rel="icon" type="image/jpeg" href="/rnctech.jpg" />
    <link rel="apple-touch-icon" href="/rnctech.jpg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Platform streaming musik premium dari RNC Tech" />
    
    <!-- 🔥 UBAH JUDUL WEB DI SINI 🔥 -->
    <title>RnC music Premium</title>

    <!-- 🔥 DAFTARIN KTP APLIKASI (MANIFEST) BIAR BISA DI-INSTALL 🔥 -->
    <link rel="manifest" href="/manifest.json" />

    <!-- 🔥 ALAT DETEKTIF CONSOLE DI HP (ERUDA) 🔥 -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- 🔥 MESIN PENYEDOT OFFLINE (SERVICE WORKER) 🔥 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('🔥 Mesin Caching Offline Aktif!');
          }).catch(err => console.log('Gagal:', err));
        });
      }
    </script>
  </body>
</html>
