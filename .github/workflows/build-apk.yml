name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Meracik APK
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kodingan
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Modul
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Sinkronisasi ke Android
        run: npx cap sync android

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Proses Build APK!
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Siapkan File APK untuk Di-download
        uses: actions/upload-artifact@v4
        with:
          name: RnCmusic-App
          path: android/app/build/outputs/apk/debug/app-debug.apk